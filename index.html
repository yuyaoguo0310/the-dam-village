function entry(){state=null;$('#app').innerHTML='<div class="hero"><section class="hero-copy"><div class="campus-ribbon" style="display:none"><svg viewBox="0 0 90 45" aria-hidden="true"><path d="M0 32Q15 24 30 32T60 32T90 32M0 40Q15 32 30 40T60 40T90 40" fill="none" stroke="#047c91" stroke-width="2"/><path d="M43 29V6L51 0 59 6V29M39 29H63" fill="#003660"/><circle cx="51" cy="10" r="3" fill="#FEBC11"/><path d="M46 16V26M56 16V26" stroke="#eaf0f2" stroke-width="1.5"/></svg><div><strong>UC Santa Barbara · ENVS 156</strong><span>A student-made discussion experience, inspired by our coast.</span></div></div><div class="eyebrow">A classroom conversation about water &amp; power</div><h1>One river.<br>Many futures.</h1><p class="intro">A dam could change this village. Step into a stakeholder’s shoes, weigh the trade-offs, and decide together.</p><div class="card entry" id="entry-card">'+(mode==='host'?'<h3>Host a classroom</h3><p class="muted">Guide the discussion from your projector. Students join with a classroom code.</p><button class="primary" id="create">Create classroom →</button><details><summary>Recover an existing classroom</summary><label for="room">Classroom code</label><input id="room" maxlength="6" autocomplete="off"><label for="recover-key">Host recovery key</label><input id="recover-key" type="password"><button id="recover" style="margin-top:12px">Recover classroom</button></details>':'<h3>'+(mode==='guide'?'Join as a group guide':'Join your village')+'</h3><form id="join-form"><label for="room">Classroom code</label><input id="room" name="room" maxlength="6" placeholder="e.g. A1B2C3" required autocapitalize="characters" autocomplete="off" value="'+esc(params.get('room')||'')+'"><label for="name">Your nickname</label><input id="name" name="name" maxlength="24" placeholder="What should your team call you?" autocomplete="nickname" required>'+(mode==='guide'?'<label for="group">Your group</label><select id="group">'+GROUPS.map((g,i)=>'<option value="'+i+'">'+g+'</option>').join('')+'</select><label for="guide-key">Group guide key</label><input id="guide-key" type="password" required>':'')+'<button class="primary" id="join" style="width:100%;margin-top:20px">'+(mode==='guide'?'Join as guide':'Enter the village')+' →</button></form><p class="muted" style="font-size:12px;margin:12px 0 0">No account needed. Your place is saved on this device.</p><details><summary>Already joined on another device?</summary><label for="recover-key">Your recovery key</label><input id="recover-key" type="password"><button id="recover" style="margin-top:12px">Rejoin classroom</button></details>')+'<div id="error" class="error" role="alert"></div></div><div class="btn-link">'+(mode==='student'?'<a href="'+route('host')+'">Host dashboard</a> &nbsp; · &nbsp; <a href="'+route('guide')+'">Group guide entry</a>':'<a href="'+route()+'">Student entry</a>')+'</div></section><div class="hero-map">'+mapShell(true)+'<p class="muted" style="font-size:12px;text-align:center;margin-top:12px">An imagined village. A real discussion.</p></div></div>'+footer();if($('#create'))$('#create').onclick=createRoom;if($('#join-form'))$('#join-form').onsubmit=joinRoom;$('#recover').onclick=recover}
async function createRoom(){if(busy)return;busy=true;$('#create').disabled=true;try{const r=await call('create',{},null);saveSession({room:r.code,key:r.key});await refresh();showRecovery(true)}catch(e){error(e.message)}finally{busy=false;if($('#create'))$('#create').disabled=false}}
async function joinRoom(e){e.preventDefault();if(busy)return;busy=true;$('#join').disabled=true;try{const room=$('#room').value.trim().toUpperCase(),key=randomKey(),credential={room,key};const r=await call('join',{name:$('#name').value,kind:mode==='guide'?'guide':'student',...(mode==='guide'?{group:Number($('#group').value),guideKey:$('#guide-key').value.trim()}:{}),room},credential);saveSession(credential);accept(r);announce('You have joined '+GROUPS[r.me.group]);}catch(e){error(e.message)}finally{busy=false;if($('#join'))$('#join').disabled=false}}
async function recover(){try{const s={room:$('#room').value.trim().toUpperCase(),key:$('#recover-key').value.trim()};const r=await call('state',null,s);if(r.me.kind!==mode)throw Error('Use the matching host, student, or guide entry for this key.');saveSession(s);accept(r)}catch(e){error(e.message)}}
function accept(r){if(r.me.kind!==mode)throw Error('Use the matching host, student, or guide entry for this key.');clockOffset=r.serverTime-Date.now();const signature=JSON.stringify({...r,serverTime:0,revision:0});state=r;if(signature!==lastSignature){lastSignature=signature;render()}setConnection(true);updateClock();updateMap()}
function setConnection(ok){const e=$('#connection');if(e){e.textContent=ok?'Live classroom':'Connection lost · retrying';e.className='status'+(ok?'':' off')}document.querySelectorAll('[data-live-action]').forEach(e=>e.disabled=!ok||busy)}
async function refresh(){if(!session||pollBusy)return;pollBusy=true;try{accept(await call('state'));if(Date.now()-lastBeat>15000&&state.me.kind!=='host'){lastBeat=Date.now();await call('action',{action:'heartbeat'})}}catch(e){setConnection(false);if(e.status===401||e.status===404){error(e.message);if(!state){entry();error(e.message)}}}finally{pollBusy=false}}
async function act(action,data={}){if(busy)return;busy=true;setConnection(true);try{accept(await call('action',{action,...data}))}catch(e){if(e.status===409&&action==='advance'){if(confirm(e.message+'\nClose this vote now?')){busy=false;return act(action,{force:true})}}else error(e.message)}finally{busy=false;setConnection(!$('#connection')?.classList.contains('off'))}}
function phaseStrip(){let i=PHASES.indexOf(state.phase);return '<div class="phase-strip">'+LABELS.map((x,j)=>'<div class="phase-step '+(j===i?'active':j<i?'done':'')+'">'+(j+1)+' · '+x+'</div>').join('')+'</div>'}
function timer(){return state.timer?'<div class="row"><div class="clock" id="clock" aria-label="Time remaining">--:--</div><small id="timer-label"></small></div>':''}
function render(){const guideDraft=$('#recommendation')?.value,focused=document.activeElement?.id;$('#app').innerHTML=state.me.kind==='host'?hostView():studentView();bind();if(guideDraft!==undefined&&$('#recommendation'))$('#recommendation').value=guideDraft;if(focused==='recommendation')$('#recommendation')?.focus();updateClock();updateMap()}
function hostView(){const idx=PHASES.indexOf(state.phase),round=state.phase==='final-vote'?1:0;return '<div class="screen-title"><div><div class="eyebrow">Host dashboard · Classroom '+esc(state.code)+'</div><h2>'+LABELS[idx]+'</h2><span class="status" id="connection">Live classroom</span></div><div class="row"><button id="projector">Projector view ↗</button><button id="join-qr">Join QR</button><button id="setup">Invite &amp; keys</button></div></div>'+phaseStrip()+'<div class="host-layout"><section><div id="map-container">'+mapShell()+'</div><div id="future-panels">'+futurePanels()+'</div><div class="group-cards">'+GROUPS.map((g,i)=>groupCard(i)).join('')+'</div>'+(state.phase==='results'?resultsView():'')+'</section><aside class="sidebar"><div class="card"><div class="eyebrow">In the village</div><div class="big-number">'+state.studentCount+' <small>students</small></div><p class="muted" style="font-size:13px;margin:4px 0 14px">'+state.roster.filter(p=>p.kind==='guide').length+' / 4 group guides · '+state.roster.filter(p=>p.online&&p.kind==='student').length+' students connected</p>'+(['first-vote','final-vote'].includes(state.phase)?'<div class="notice">'+state.submitted[round]+' / '+state.studentCount+' votes submitted<br><small>Choices remain private.</small></div>':'')+timer()+'<p class="muted" id="phase-description" style="font-size:14px;margin-top:12px">'+['Share the join code. Students receive a balanced stakeholder role.','Invite students to make an individual first decision.','Gather around your group guide. Discuss the prompts and agree on a recommendation.','Each group presents its recommendation. Ask one another for evidence and challenge assumptions.','Vote individually again. You may keep or change your view.','Compare anonymous votes, then explore both illustrative futures.'][idx]+'</p></div><div class="card host-controls"><h3>Guide the session</h3>'+(idx<5?'<button class="primary" id="advance" data-live-action>'+['Open first vote','Start group discussion','Start debate','Open final vote','Close vote &amp; reveal results'][idx]+' →</button>':'<button class="primary" id="dam-future" data-live-action>▶ If we build the dam</button><button id="alt-future" data-live-action>Explore alternatives</button><button id="clear-future" data-live-action>Return to village</button>')+(state.timer?'<div class="row"><button id="pause" data-live-action>'+(!state.timer.endsAt?'Resume':'Pause')+'</button><button id="timer-reset" data-live-action>Set time</button></div>':'')+'<div id="error" class="error" role="alert"></div><small>Phases change only when you advance. Timers do not close votes.</small>'+(state.phase==='results'?'<button id="export">Download anonymous results</button><button id="new-class">New classroom</button>':'')+'</div></aside></div>'+footer()}
function groupCard(i){const p=state.roster.filter(x=>x.group===i),students=p.filter(x=>x.kind==='student');return '<div class="card group-card" style="border-top:3px solid '+COLORS[i]+'"><h3>'+SHORT[i]+'</h3><small>'+students.length+' students · '+p.filter(x=>x.kind==='guide').length+' guide</small>'+(state.recommendations[i]?'<p style="font-size:13px;margin:12px 0 0">“'+esc(state.recommendations[i])+'”</p>':'')+'<ul class="roster">'+p.map(x=>'<li><span><i class="online '+(x.online?'':'offline')+'"></i>'+esc(x.name)+(x.kind==='guide'?' ★':'')+'</span><small>'+(['first-vote','final-vote'].includes(state.phase)&&x.kind==='student'?(x.submitted[state.phase==='first-vote'?0:1]?'Voted':'Pending'):(x.online?'Here':'Away'))+'</small></li>').join('')+'</ul></div>'}
const ROLE_ARGUMENTS=[
 {position:'Protect our crops, land, and access to water.',
 support:['Stored water could help us irrigate during dry periods, rather than depend only on the river that day.','Reliable seasonal water could protect harvests; irrigation can improve food production without expanding farmland.'],
 concerns:['Electricity demand and crop water needs may require different release schedules. A dam alone does not guarantee us water.','Reservoir flooding could take farmland or homes; benefits are not enough if affected families lose their livelihoods.'],
 conditions:['Agree on enforceable irrigation rights and a seasonal release plan, including drought rules.','Protect affected households. Compare efficient irrigation, less water-intensive crops, soil moisture from rain, and groundwater recharge before committing.'],
 questions:['To Hydropower: When electricity demand peaks, how will you protect water needed for crops?','To Government: Who can enforce our allocation, and what happens in a dry year?']},
 {position:'Provide reliable electricity while managing shared water.',
 support:['Hydropower can generate renewable electricity; stored water can be released when electricity is needed.','A multipurpose reservoir could support both electricity and irrigation if operations are coordinated.'],
 concerns:['We cannot promise unlimited power and irrigation from the same stored water. Release timing, dry periods, and reservoir evaporation matter.','A solar-and-storage alternative must be assessed for variable supply and the amount of storage needed. Hydropower also has ecological and social costs.'],
 conditions:['Negotiate an operating schedule with farmers and downstream users, rather than promise every benefit at once.','Compare the full energy portfolio, including solar, storage, and improvements to existing infrastructure; accept ecological and community safeguards.'],
 questions:['To Farmers: Which months and times are most important for crop water?','To Environment: What river requirements should our operating plan meet?']},
 {position:'Protect river connections, habitats, and affected people.',
 support:['A connected river allows movement through habitats; a new barrier and altered releases could disrupt that connection.','Efficiency and alternative energy or water storage could meet needs while avoiding some impacts of a new dam.'],
 concerns:['Reservoir flooding could affect habitats and homes; downstream flow and sediment changes also need assessment.','Alternatives are not impact-free: solar needs storage, recharge needs recoverable water and land, and local feasibility is uncertain.'],
 conditions:['Require ecological flow rules, an assessment of connectivity and affected communities, and independent monitoring.','Give affected people a meaningful voice and compare ways to meet the same energy and food needs before choosing a new dam.'],
 questions:['To Hydropower: How will you protect downstream flows as demand for electricity changes?','To Government: Who represents displaced or downstream residents, and who checks the safeguards?']},
 {position:'Meet public needs through an equitable, accountable decision.',
 support:['A reservoir could provide useful energy and irrigation services; coordinated planning could help serve several needs.','A combination of infrastructure and smaller measures may provide those services with different costs and impacts.'],
 concerns:['Benefits and burdens may fall on different people. A majority vote alone does not protect an affected household.','Demand and water availability are uncertain. We need local operating and demand data before promising village outcomes.'],
 conditions:['Publish who receives water and electricity, who bears costs, and how affected people take part in the decision.','Compare ways to provide the same food and energy services with less demand, including efficiency and reduced food waste. Set enforceable ecological and allocation rules.'],
 questions:['To every group: What is your minimum condition, and who would enforce it?','To every group: Could we meet the same needs with less water or a mix of smaller measures?']}
];
function argumentList(items){return '<ul class="prompt-list">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function roleArguments(g,guide=false){const a=ROLE_ARGUMENTS[g];return '<p class="notice"><b>Our priority:</b> '+esc(a.position)+'</p><h3>Arguments to make</h3>'+argumentList(a.support)+'<h3>Concerns to raise</h3>'+argumentList(a.concerns)+(guide?'<h3>Conditions we could ask for</h3>'+argumentList(a.conditions)+'<h3>Questions for the other groups</h3>'+argumentList(a.questions):'')}
function guideBrief(g){return '<section class="card guide-brief"><div class="eyebrow">Group guide · '+SHORT[g]+' talking points</div><h2 style="font-size:26px;margin:8px 0 12px">Help your group build its case.</h2>'+roleArguments(g,true)+'<details><summary>How to lead the discussion</summary><ol class="prompt-list"><li>Start with a quick personal reaction, then invite each person to speak before debating.</li><li>Ask open questions: Why does this matter to our group? Who is missing from this decision? Invite quieter voices without pressuring them.</li><li>Ask what assumption supports each claim and what local information is missing. Let classmates respond to each other; guide rather than lecture.</li><li>Prepare a 30-second report: our position → two reasons → strongest trade-off → one condition.</li></ol><p>You do not vote or control the host. These are possible arguments, not a script or a required opinion. Students decide individually.</p></details></section>'}
function studentView(){const me=state.me,g=me.group,r=ROLES[g],index=state.phase==='first-vote'?0:state.phase==='final-vote'?1:-1;return '<div class="student stack"><div><div class="screen-title" style="margin-bottom:8px"><div><div class="eyebrow">Classroom '+esc(state.code)+' · '+esc(me.name)+'</div><h2>'+LABELS[PHASES.indexOf(state.phase)]+'</h2><span class="status" id="connection">Live classroom</span></div><button class="quiet" id="recovery">My entry key</button></div>'+phaseStrip()+'</div>'+(me.kind==='guide'?guideBrief(g):'')+'<div class="card role-card" style="border-top-color:'+COLORS[g]+'"><span class="role-number">0'+(g+1)+'</span><div class="eyebrow">'+(me.kind==='guide'?'Group guide · No vote':'Your stakeholder identity')+'</div><h2>'+GROUPS[g]+'</h2><p>'+r.mission+'</p><div class="benefits"><div><h3>Possible benefits</h3><ul>'+r.benefits.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div><h3>Possible risks</h3><ul>'+r.risks.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div><p class="notice">'+r.question+'</p>'+(me.kind==='student'?'<details><summary>Talking points for our group</summary>'+roleArguments(g)+'</details>':'')+'</div>'+(index>=0&&me.kind==='student'?'<section class="card"><div class="eyebrow">Individual decision · Round '+(index+1)+'</div><h2 style="margin:10px 0 18px;font-size:28px">Should the village build the dam?</h2><div class="vote-options">'+CHOICES.map((c,i)=>'<button data-vote="'+c+'" data-live-action class="'+(me.votes[index]===c?'selected':'')+'" aria-pressed="'+(me.votes[index]===c)+'">'+VOTE_LABELS[i]+'<span>'+(me.votes[index]===c?'✓':'○')+'</span></button>').join('')+'</div><p class="muted" style="font-size:13px;margin:12px 0 0">'+(me.votes[index]?'Vote saved. You may change it until the host closes this round.':'Your choice is private. Your guide cannot vote for you.')+'</p></section>':'')+(['discussion','debate'].includes(state.phase)?'<section class="card"><div class="screen-title"><div><div class="eyebrow">'+(state.phase==='discussion'?'Discuss in person':'Listen, question, reflect')+'</div><h2 style="margin:8px 0;font-size:28px">'+(state.phase==='discussion'?'Find your common ground.':'Make the case. Hear the others.')+'</h2></div></div>'+timer()+'<ol class="prompt-list">'+PROMPTS.map(x=>'<li>'+x+'</li>').join('')+'</ol>'+(me.kind==='guide'?'<div class="notice">Invite every voice. Ask everyone to explain their reasons and trade-offs. You guide the conversation; students make their own decisions.</div><label for="recommendation">Your group’s recommendation</label><textarea id="recommendation" maxlength="600" rows="3" placeholder="We recommend… because… provided that…">'+esc(state.recommendations[0])+'</textarea><button id="save-recommendation" class="primary" data-live-action style="margin-top:10px">Share recommendation</button><span id="saved-note" role="status" style="margin-left:10px;font-size:13px"></span>':state.recommendations[0]?'<div class="notice"><b>Your group’s recommendation</b><br>'+esc(state.recommendations[0])+'</div>':'')+'</section>':'')+(state.phase==='results'?'<section class="card"><div class="eyebrow">Your reflection</div><h2 style="font-size:28px;margin:8px 0 15px">What influenced your decision?</h2><p>'+(me.kind==='student'?'Your first vote: <b>'+esc(me.votes[0]?VOTE_LABELS[CHOICES.indexOf(me.votes[0])]:'Not submitted')+'</b><br>Your final vote: <b>'+esc(me.votes[1]?VOTE_LABELS[CHOICES.indexOf(me.votes[1])]:'Not submitted')+'</b>':'Thank you for guiding your group.')+'</p><p class="muted">Which argument, trade-off, or uncertainty mattered most? The host will reveal both possible futures.</p>'+futurePanels()+'</section>':state.phase==='lobby'||(index>=0&&me.kind==='guide')?'<div class="notice">'+(me.kind==='guide'?'You guide the discussion and do not vote. Help everyone read their identity card.':'Read your identity card and meet your team. The host will open the first vote.')+'</div>':'')+'<section class="card"><h3>Your team</h3><div class="teammates">'+state.roster.map(x=>'<span class="tag '+(x.kind==='guide'?'guide':'')+'">'+esc(x.name)+(x.kind==='guide'?' ★ Group guide':'')+(x.id===me.id?' · You':'')+'</span>').join('')+'</div>'+(!state.roster.some(x=>x.kind==='guide')?'<p class="muted" style="font-size:13px;margin:12px 0 0">Your group guide has not joined yet.</p>':'')+'</section><div id="error" class="error" role="alert"></div>'+footer()+'</div>'}
function futurePanels(){if(!state.future)return '';let dam=state.future.mode==='dam';return '<div class="scenario-note">Illustrative scenario · Potential impacts, not predictions for this village. Both benefits and costs are shown regardless of the class vote. Village outcomes require local evidence.</div><div class="future-panels"><div class="card"><h3>'+ (dam?'Potential benefits':'Alternative benefits')+'</h3><ul>'+(dam?['Renewable electricity and possible generation flexibility.','Stored water may improve irrigation reliability.','Multipurpose storage can serve energy and food production.']:['Solar plus storage can provide energy without a new river barrier.','Groundwater recharge may store water underground.','Efficient irrigation can reduce water required per unit of output.']).map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="card"><h3>'+(dam?'Potential costs':'Limits &amp; trade-offs')+'</h3><ul>'+(dam?['A barrier may fragment river habitats and fish movement.','Reservoir flooding may affect habitats, farms, and homes.','Changed flow and sediment can affect downstream communities.','Release timing can conflict; evaporation and water-access inequalities also matter.']:['Solar variability requires adequate storage, grid planning, materials, and funding.','Recharge needs land, recoverable water, and funding; scaling remains uncertain.','Less water-intensive crops, soil moisture, and reduced food waste may lower demand; local savings are not guaranteed.','A shared plan also requires participation, equity, and ecological protection.']).map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>'}
function resultsView(){let r=state.results,total=state.studentCount||1;return '<section class="card results"><div class="eyebrow">Anonymous class comparison</div><h2 style="margin:8px 0 15px">Did the conversation change us?</h2><p><b>'+r.changed+'</b> changed · <b>'+r.unchanged+'</b> kept their view · <b>'+r.paired+'</b> voted in both rounds</p><small>'+r.unpaired+' students without a matched pair. Change counts use only matched votes; bars use each round’s submissions.</small><div class="row" style="margin:16px 0"><span class="pill">Green = Before</span><span class="pill">Amber = After</span></div>'+VOTE_LABELS.map((x,i)=>'<div class="chart-row"><span>'+x+' · before</span><div class="bar"><i style="width:'+r.before[i]/total*100+'%"></i></div><b>'+r.before[i]+'</b></div><div class="chart-row"><span>'+x+' · after</span><div class="bar after"><i style="width:'+r.after[i]/total*100+'%"></i></div><b>'+r.after[i]+'</b></div>').join('')+'<details><summary>How votes moved between choices</summary><div style="overflow-x:auto"><table><caption class="sr-only">Anonymous matched votes: rows before, columns after</caption><thead><tr><th>Before → After</th>'+VOTE_LABELS.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r.matrix.map((row,i)=>'<tr><th scope="row">'+VOTE_LABELS[i]+'</th>'+row.map(n=>'<td>'+n+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details></section>'}
function bind(){if($('#join-qr'))$('#join-qr').onclick=showJoinQR;if($('#advance'))$('#advance').onclick=()=>act('advance');if($('#projector'))$('#projector').onclick=()=>{document.body.classList.add('projector');announce('Projector view opened')};if($('#setup'))$('#setup').onclick=hostSetup;if($('#recovery'))$('#recovery').onclick=()=>showRecovery(false);document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>act('vote',{choice:b.dataset.vote}));if($('#save-recommendation'))$('#save-recommendation').onclick=async()=>{const text=$('#recommendation').value;await act('recommend',{text});if($('#saved-note'))$('#saved-note').textContent=state.recommendations[0]===text.trim()?'Saved':''};if($('#pause'))$('#pause').onclick=()=>act('timer',{mode:state.timer.endsAt?'pause':'resume'});if($('#timer-reset'))$('#timer-reset').onclick=()=>{const minutes=prompt('How many minutes? (0.5–60)','6');if(minutes!==null)act('timer',{seconds:Number(minutes)*60})};if($('#dam-future'))$('#dam-future').onclick=()=>act('future',{mode:'dam'});if($('#alt-future'))$('#alt-future').onclick=()=>act('future',{mode:'alternatives'});if($('#clear-future'))$('#clear-future').onclick=()=>act('future',{mode:null});if($('#export'))$('#export').onclick=exportResults;if($('#new-class'))$('#new-class').onclick=()=>{if(confirm('Create a new classroom? The current classroom and results remain available with its host key.')){session=null;guideKeys=null;entry()}}}
function updateClock(){const now=Date.now()+clockOffset;if($('#clock')&&state.timer){let ms=state.timer.endsAt?Math.max(0,state.timer.endsAt-now):state.timer.remaining||0,s=Math.ceil(ms/1000);$('#clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('#timer-label').textContent=state.timer.endsAt?(s?'remaining':'Time is up · host will advance'):'Paused'}if(state?.future)updateFuture(now)}
function avatarMarkup(p){let col=COLORS[p.group];return '<g class="avatar" data-id="'+esc(p.id)+'"><circle cy="-13" r="6" fill="#d8b58c" stroke="#796f59"/><path d="M-8-4Q0-9 8-4L9 9H-9Z" fill="'+col+'" stroke="#6e7e63"/><path d="M-5 9L-6 16M5 9L6 16" stroke="#66765d" stroke-width="3"/><text text-anchor="middle" y="31">'+esc(p.name.slice(0,12))+'</text>'+(p.kind==='guide'?'<text y="-24" text-anchor="middle" style="fill:#a2742c;font-size:18px">★</text>':'')+'</g>'}
function updateMap(){if(!state||!$('#avatars'))return;let avatars=$('#avatars');const existing=new Set([...avatars.querySelectorAll('[data-id]')].map(x=>x.dataset.id));for(const p of state.roster)if(!existing.has(p.id))avatars.insertAdjacentHTML('beforeend',avatarMarkup(p));const grouped=PHASES.indexOf(state.phase)>=2,bases=[[145,355],[655,330],[655,594],[130,625]];for(const p of state.roster){const same=state.roster.filter(x=>x.kind==='student'&&x.group===p.group),n=same.findIndex(x=>x.id===p.id),columns=6;let x,y;if(p.kind==='guide'){const guideSpots=[[118,286],[895,240],[890,488],[118,500]];[x,y]=guideSpots[p.group]}else if(grouped){x=bases[p.group][0]+n%columns*38;y=bases[p.group][1]+Math.floor(n/columns)*38*(p.group>=2?-1:1)}else{const nAll=state.roster.filter(x=>x.kind==='student').findIndex(x=>x.id===p.id);x=350+(nAll%8)*38;y=365+Math.floor(nAll/8)*42;}const e=[...avatars.children].find(x=>x.dataset.id===p.id);const pos='translate('+x+' '+y+')';avatarPositions.set(p.id,pos);requestAnimationFrame(()=>requestAnimationFrame(()=>e?.setAttribute('transform',pos)));if(e)e.style.opacity=p.online?1:.45}updateFuture(Date.now()+clockOffset)}
function storyPose(t,frames){if(t<=frames[0][0])return frames[0].slice(1);for(let i=1;i<frames.length;i++){if(t<=frames[i][0]){const a=frames[i-1],b=frames[i],u=(t-a[0])/(b[0]-a[0]);return a.slice(1).map((v,j)=>v+(b[j+1]-v)*u)}}return frames.at(-1).slice(1)}
function updateStory(stage,dam,alt){const shell=$('#map-shell'),actor=$('#fish-performer');if(!shell||!actor)return;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const t=reduced?(dam?10:alt?9:0):stage;
 shell.classList.toggle('fish-hit',dam&&((t>=4.7&&t<5.25)||(t>=5.85&&t<6.35)));
 shell.classList.toggle('fish-exhausted',dam&&t>=6.8);shell.classList.toggle('crop-celebrate',dam&&t>=2.8&&t<4.5);shell.classList.toggle('cloudy',alt&&t>=1.2&&t<4.8);shell.classList.toggle('curtain-call',(dam&&t>=9)||(alt&&t>=7));
 let pose=[0,0,0],speech='',ending='';
 if(dam){pose=storyPose(t,[[0,0,0,0],[3.7,0,22,-70],[4.7,9,-61,-90],[4.9,-8,-50,-135],[5.3,-3,-4,-55],[5.85,12,-60,-90],[6.05,-10,-46,-130],[6.8,-6,10,-160],[7.3,5,23,-180],[10,5,23,-180]]);speech=t<3.7?'':t<4.7?'Coming through! Going home!':t<5.3?'Excuse me… WHO put that here?!':t<5.85?'Okay. One more try.':t<6.8?'My commute has been cancelled.':'I just wanted to go HOME.';if(t>=9)ending='The village got power. The fish got a wall.';
 }else if(alt){pose=storyPose(t,[[0,0,25,-70],[1,5,0,-90],[3,12,-67,-90],[5,50,-129,-80],[7,45,-178,-105],[9,45,-178,-105]]);speech=t<1.2?'No wall? Best commute ever.':t<4.8?'Fish: happy. Solar: waiting for the sun.':'I can swim. You still need a plan.';if(t>=7)ending='Happy fish. Homework for the humans.';}
 actor.setAttribute('transform','translate('+pose[0]+' '+pose[1]+') rotate('+pose[2]+')');
 const bubble=$('#story-speech'),finale=$('#story-finale');if(bubble){bubble.classList.toggle('visible',!!speech);if(bubble.textContent!==speech)bubble.textContent=speech}if(finale){finale.classList.toggle('visible',!!ending);const html=ending?'<b>'+ending+'</b><span>'+(dam?'Who benefits? Who pays?':'Storage, water, cost, and fair access still matter.')+' · Comic what-if, not a forecast.</span>':'';if(finale.innerHTML!==html)finale.innerHTML=html}
}
function updateFuture(now){
 const shell=$('#map-shell');if(!shell||!state)return;
 const f=state.future,stage=f?(matchMedia('(prefers-reduced-motion: reduce)').matches?(f.mode==='dam'?10:9):Math.max(0,(now-f.startedAt)/1000)):0,dam=f?.mode==='dam',alt=f?.mode==='alternatives';
 shell.classList.toggle('built',dam&&stage>=.35);shell.classList.toggle('power-on',dam&&stage>=1.7);shell.classList.toggle('costs',dam&&stage>=4.5);shell.classList.toggle('alternatives',alt);
 shell.classList.toggle('allocation-conflict',dam&&stage>=8);
 shell.classList.toggle('alt-community',alt&&stage>=5.2);
 shell.classList.toggle('alt-solar',alt&&stage>=.3);shell.classList.toggle('alt-recharge',alt&&stage>=1.8);shell.classList.toggle('alt-drip',alt&&stage>=3.2);
 if($('#dam-label'))$('#dam-label').textContent=dam&&stage>=.35?'Dam · illustrative':'Proposed dam';
 let title='',text='',cues=[];
 if(dam){
 title=stage<1.7?'Act I · A very big wall.':stage<3.7?'Act II · Lights! Crops! Applause!':stage<6.8?'Act III · One fish versus a dam.':stage<9?'The fish would like a refund.':'Curtain call · Benefits AND costs.';
 text=stage<1.7?'The reservoir grows. The village holds its breath.':stage<3.7?'Potential electricity and irrigation benefits arrive.':stage<6.8?'An upstream journey meets a rather solid obstacle.':stage<9?'Flooded land, changed flows, and shared water complicate the celebration.':'A comic ending to a real question: whose needs and rights are protected?';
 if(stage>=1.7)cues.push({x:73,y:27,label:'⚡ Renewable electricity',detail:'Dispatchable generation'});
 if(stage>=2.8)cues.push({x:15,y:29,label:'💧 Irrigation water',detail:'Shared storage · release timing matters'});
 if(stage>=4.5)cues.push({x:70,y:56,label:'↔ Fish route interrupted',detail:'River habitat fragmentation',type:'cost'});
 if(stage>=5.8)cues.push({x:35,y:24,label:'≈ Habitats & homes at risk',detail:'Possible reservoir flooding',type:'cost'});
 if(stage>=8.5)cues.push({x:41,y:12,label:'↑ Stored water can be lost',detail:'Evaporation · not unlimited supply',type:'cost'});
 if(stage>=8)cues.push({x:62,y:43,label:'⇄ One reservoir, competing needs',detail:'Who gets water, and when?',type:'limit'});
 if(stage>=7.1)cues.push({x:40,y:82,label:'↓ Downstream flow changes',detail:'Flow, sediment & people',type:'cost'});
 }else if(alt){
 title=stage<1.8?'Another way to power the village.':stage<3.2?'Store water beneath our feet.':stage<5.2?'Make each drop go further.':'Alternatives have trade-offs too.';
 text=stage<1.8?'Solar panels and storage appear beside a connected river.':stage<3.2?'Recharge may help store available water underground.':stage<5.2?'Efficient irrigation and crop choices may reduce water demand.':'A shared plan also asks who participates and which water services matter. It can complement existing infrastructure.';
 if(stage>=.3)cues.push({x:61,y:65,label:'☀ Solar + storage',detail:'Variable supply needs storage'});
 if(stage>=1.8)cues.push({x:28,y:64,label:'↓ Groundwater recharge',detail:'Retrieval, land & scaling limits'});
 if(stage>=3.2)cues.push({x:13,y:29,label:'💧 Efficient irrigation',detail:'More crop per drop · crop choices matter'});
 if(stage>=5.8)cues.push({x:11,y:73,label:'◎ A shared plan',detail:'Protect ecological needs · include affected people'});
 if(stage>=5.2)cues.push({x:55,y:23,label:'! No guaranteed solution',detail:'Dispatchability, retrieval, cost & scale',type:'limit'});
 }
 const key=(f?.mode||'none')+':'+(f?.startedAt||0)+':'+cues.length+':'+title;
 const caption=$('#future-caption'),layer=$('#impact-cues');
 if(caption.dataset.stage!==key){caption.dataset.stage=key;caption.innerHTML=f?'<div class="future-caption"><b>'+title+'</b>'+text+'<div class="future-progress"><i id="future-progress-fill"></i></div><small>Illustrative · '+(dam?'10':'9')+'-second comic story</small></div>':'';
 if(layer)layer.innerHTML=cues.map(c=>'<div class="impact-cue '+(c.type||'')+'" style="left:'+c.x+'%;top:'+c.y+'%">'+c.label+'<span>'+c.detail+'</span></div>').join('');}
 updateStory(stage,dam,alt);
 if($('#future-progress-fill'))$('#future-progress-fill').style.width=Math.min(100,stage/(dam?10:9)*100)+'%';
}

function modal(content){$('#modal-root').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="Entry and classroom details">'+content+'<button id="close-modal" class="primary" style="margin-top:18px">Done</button></section></div>';const previous=document.activeElement;$('#close-modal').onclick=()=>{$('#modal-root').innerHTML='';previous?.focus()};$('#close-modal').focus();$('.modal').onkeydown=e=>{if(e.key==='Escape')$('#close-modal').click();if(e.key==='Tab'){const focus=[...$('.modal').querySelectorAll('button,a,input')];if(e.shiftKey&&document.activeElement===focus[0]){e.preventDefault();focus.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focus.at(-1)){e.preventDefault();focus[0].focus()}}}}
function showRecovery(host){modal('<div class="eyebrow">'+(host?'Keep this private · Host access':'Keep this private · Your entry')+'</div><h2 style="margin:10px 0">Save your recovery key.</h2><p>You are saved on this browser. Copy this key to recover your place on another device. Anyone with it can use your entry.</p><p>Classroom <b>'+esc(session.room)+'</b></p><code class="key">'+esc(session.key)+'</code><button id="copy-key">Copy key</button>');$('#copy-key').onclick=()=>copy(session.key,$('#copy-key'))}
async function copy(value,button){try{await navigator.clipboard.writeText(value);button.textContent='Copied'}catch{button.textContent='Select and copy the text above'}}
function qrSVG(url){const qr=qrcode(0,'M');qr.addData(url);qr.make();return qr.createSvgTag({cellSize:6,margin:24,scalable:true,alt:'Scan to join The Dam Village'});}
function qrImage(url){return '<img class="qr-image" alt="QR code for student entry" src="data:image/svg+xml;base64,'+btoa(qrSVG(url))+'">';}
function studentJoinURL(){return route('student',state.code);}
function downloadQR(url,name){const blob=new Blob([qrSVG(url)],{type:'image/svg+xml'}),href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);}
function showJoinQR(){if(!state||state.me.kind!=='host')return;const url=studentJoinURL();modal('<div class="eyebrow">UC Santa Barbara · ENVS 156</div><h2 style="margin:10px 0;text-align:center">Scan to join our village.</h2><div class="qr-box">'+qrImage(url)+'<div class="qr-code">'+state.code+'</div><p class="qr-hint">Or type the classroom code. No account needed.</p></div><code class="key">'+esc(url)+'</code><div class="row qr-actions"><button id="qr-copy">Copy student link</button><button id="qr-download">Download QR</button></div>');$('#qr-copy').onclick=()=>copy(url,$('#qr-copy'));$('#qr-download').onclick=()=>downloadQR(url,'dam-village-'+state.code+'-join.svg');}
async function hostSetup(){try{guideKeys=(await call('guides')).guides;const joinURL=studentJoinURL();modal('<div class="eyebrow">Share the student link</div><h2 style="margin:10px 0">Welcome to the village.</h2><div class="qr-box">'+qrImage(joinURL)+'<div class="qr-code">'+state.code+'</div></div><code class="key">'+esc(joinURL)+'</code><button id="copy-link">Copy student link</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Guide keys · Share individually</h3><p class="muted" style="font-size:13px">Guides enter at '+esc(route('guide'))+' and select their own group. These keys do not grant host access.</p>'+guideKeys.map((key,i)=>'<label>'+GROUPS[i]+'</label><code class="key">'+key+'</code>').join('')+'<details><summary>Host recovery key · Keep private</summary><code class="key">'+esc(session.key)+'</code></details>');$('#copy-link').onclick=()=>copy(joinURL,$('#copy-link'))}catch(e){error(e.message)}}
function exportResults(){const r=state.results;const lines=['The Dam Village — Anonymous Results','Classroom,'+state.code,'Students,'+state.studentCount,'Choice,Before,After',...VOTE_LABELS.map((x,i)=>x+','+r.before[i]+','+r.after[i]),'Paired,'+r.paired,'Changed,'+r.changed,'Unchanged,'+r.unchanged,'Unpaired,'+r.unpaired,'','Before / After,'+VOTE_LABELS.join(','),...r.matrix.map((x,i)=>VOTE_LABELS[i]+','+x.join(','))];const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='dam-village-'+state.code+'-anonymous-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function animateStoryFrame(){const f=state?.future;if(f&&!document.hidden){const t=Math.max(0,(Date.now()+clockOffset-f.startedAt)/1000);if(t<=(f.mode==='dam'?10:9))updateStory(t,f.mode==='dam',f.mode==='alternatives')}requestAnimationFrame(animateStoryFrame)}requestAnimationFrame(animateStoryFrame);
document.querySelector('.brand').href=route();entry();if(session)refresh();setInterval(refresh,2000);setInterval(updateClock,500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
